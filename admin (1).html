<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestion Événements">
<link rel="manifest" href="./manifest-admin.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Punish Concept — ADMIN</title>
<style>
html,body,#app{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:#fff}
iframe{display:block;width:100%;height:100%;border:0;background:#000}
#missing{display:none;height:100%;align-items:center;justify-content:center;text-align:center;padding:30px;box-sizing:border-box}
#missing h1{font-size:24px;letter-spacing:.24em}
#missing p{font-size:17px;line-height:1.5;color:#aaa}
</style>
</head>
<body>
<div id="app"></div>
<div id="missing">
 <div><h1>PUNISH CONCEPT</h1><p>Accès ADMIN non configuré.<br>Ouvre ton lien personnel ADMIN une première fois.</p></div>
</div>
<script>
const APP_URL="https://script.google.com/macros/s/AKfycbyI2U-n0zBA6Db1zb7gyJTawqYOgLkUfexNAgX1Mj2b-nqShmCKRZqBCDAQwXkf297s/exec";

const ADMIN_ACCESS_KEY='punish_gestion_admin_access';
const p=new URLSearchParams(location.search);
const supplied=(p.get('access')||'').trim();
// This page never reads or writes the collaborator access token.
if(supplied) localStorage.setItem(ADMIN_ACCESS_KEY,supplied);
const access=supplied || localStorage.getItem(ADMIN_ACCESS_KEY) || '';
if(supplied) history.replaceState(null,'',location.pathname);

if(access){
  const f=document.createElement('iframe');
  f.src=APP_URL+'?access='+encodeURIComponent(access);
  f.allow='camera; clipboard-read; clipboard-write';
  document.getElementById('app').appendChild(f);
}else{
  document.getElementById('app').style.display='none';
  document.getElementById('missing').style.display='flex';
}

if('serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>
